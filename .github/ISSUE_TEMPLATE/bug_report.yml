name: 🐛 Bug Report
description: Report something that isn't working as expected
title: "fix: <short description>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the details below so it can be reproduced and fixed quickly.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / recordings
      description: If applicable, add screenshots or a screen recording to help explain the problem.

  - type: input
    id: app
    attributes:
      label: Affected app/package
      description: e.g. `apps/web`, `packages/ui`
      placeholder: apps/web
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser / OS
      placeholder: e.g. Chrome 128 on macOS 15

  - type: input
    id: node
    attributes:
      label: Node.js / pnpm version
      placeholder: e.g. Node 20.15.0, pnpm 11.21.0

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Any other context, logs, or stack traces about the problem.

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to make sure this isn't a duplicate
          required: true
        - label: I have reproduced this on the latest `main` branch
          required: true
